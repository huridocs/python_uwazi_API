services:
  uwazi-agent:
    build: .
    network_mode: host
    environment:
      - OLLAMA_API_KEY=${OLLAMA_API_KEY}
      - GRAYLOG_IP=${GRAYLOG_IP:-}
      - GRAYLOG_PORT=${GRAYLOG_PORT:-12201}
    command: ["/app/.venv/bin/uvicorn", "uwazi_agent.drivers.rest.app:app", "--host", "0.0.0.0", "--port", "5054"]
    restart: unless-stopped

  uwazi-admin-web:
    build: .
    network_mode: host
    environment:
      - UWAZI_URL=${UWAZI_URL}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY}
    volumes:
      - admin_agent_data:/app/data
    command: ["/app/.venv/bin/python", "-m", "uwazi_admin_agent.drivers.web.app"]
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=property_filler
      - POSTGRES_PASSWORD=property_filler
      - POSTGRES_DB=property_filler
    volumes:
      - property_filler_pg:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    restart: unless-stopped

  uwazi-property-filler:
    build: .
    network_mode: host
    environment:
      - UWAZI_URL=${UWAZI_URL}
      - PROPERTY_FILLER_DATABASE_URL=postgresql://property_filler:property_filler@localhost:5433/property_filler
      # `.env` is dockerignored, so these are injected by compose interpolation
      # (docker compose auto-loads the project `.env` for ${VAR} substitution).
      - PROPERTY_FILLER_TEMPLATE=${PROPERTY_FILLER_TEMPLATE:-DOCUMENT}
      - PROPERTY_FILLER_PROPERTY=${PROPERTY_FILLER_PROPERTY:-topic}
      - PROPERTY_FILLER_FILTER=${PROPERTY_FILLER_FILTER:-document_type}
      - PROPERTY_FILLER_SUBTITLE=${PROPERTY_FILLER_SUBTITLE:-}
      - PROPERTY_FILLER_PROPERTY_TEMPLATE=${PROPERTY_FILLER_PROPERTY_TEMPLATE:-}
    volumes:
      - admin_agent_data:/app/data
    command: ["/app/.venv/bin/python", "-m", "uwazi_property_filler.drivers.web.app"]
    restart: unless-stopped

volumes:
  admin_agent_data:
  property_filler_pg:
