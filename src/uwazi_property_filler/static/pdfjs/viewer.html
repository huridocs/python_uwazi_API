<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Uwazi Property Filler — PDF viewer</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #525659; }
    #container { position: relative; width: 100%; height: 100%; overflow: auto; }
    #page-wrap { position: relative; margin: 0 auto; }
    canvas.pdf-page { display: block; margin: 0 auto; box-shadow: 0 2px 8px rgba(0,0,0,0.5); }
    .highlight-rect {
      position: absolute;
      background: rgba(255, 193, 7, 0.35);
      border: 1px solid rgba(255, 152, 0, 0.8);
      pointer-events: none;
      box-sizing: border-box;
    }
    #zoom-controls {
      position: fixed; top: 12px; right: 12px; z-index: 20;
      display: flex; align-items: center; gap: 2px;
      padding: 4px; border-radius: 6px;
      background: rgba(44, 62, 80, 0.92);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
      font: 12px/1 system-ui, sans-serif;
    }
    #zoom-controls button {
      width: 28px; height: 26px; border: 0; border-radius: 4px;
      background: rgba(255, 255, 255, 0.12); color: #fff;
      font: 18px/1 system-ui, sans-serif; cursor: pointer;
    }
    #zoom-controls button:hover:not(:disabled) { background: rgba(255, 255, 255, 0.24); }
    #zoom-controls button:disabled { opacity: 0.4; cursor: default; }
    #zoom-level {
      min-width: 42px; text-align: center; color: #fff;
      font-variant-numeric: tabular-nums;
    }
    #error {
      position: fixed; inset: 0; display: none; place-items: center;
      padding: 24px; color: #fff; font: 14px/1.4 system-ui, sans-serif;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="zoom-controls" role="group" aria-label="PDF zoom">
    <button id="zoom-out" type="button" title="Zoom out" aria-label="Zoom out">−</button>
    <span id="zoom-level" aria-live="polite">100%</span>
    <button id="zoom-in" type="button" title="Zoom in" aria-label="Zoom in">+</button>
  </div>
  <div id="container">
    <div id="page-wrap"></div>
  </div>
  <div id="error"></div>
  <script type="module" src="/static/pdfjs/viewer.mjs"></script>
</body>
</html>
