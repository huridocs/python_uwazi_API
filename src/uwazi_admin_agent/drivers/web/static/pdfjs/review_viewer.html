<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Uwazi Admin Agent — entity document</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #525659; }
    #container {
      position: relative; width: 100%; height: 100%; overflow: auto;
      box-sizing: border-box; padding-top: 46px;
    }
    #page-wrap { position: relative; margin: 0 auto; }
    canvas.pdf-page { display: block; margin: 0 auto; box-shadow: 0 2px 8px rgba(0,0,0,0.5); }
    #error { color: #fff; font: 14px/1.5 system-ui, sans-serif; padding: 16px; }
    #toolbar {
      position: fixed; top: 8px; right: 12px; z-index: 10;
      display: flex; align-items: center; gap: 4px;
      padding: 4px 6px; border-radius: 6px;
      background: rgba(0, 0, 0, 0.65); color: #fff;
      font: 13px/1 system-ui, sans-serif; box-shadow: 0 1px 4px rgba(0,0,0,0.4);
    }
    #toolbar button {
      width: 26px; height: 26px; border: 0; border-radius: 4px;
      background: rgba(255,255,255,0.15); color: #fff;
      font-size: 18px; line-height: 1; cursor: pointer;
    }
    #toolbar button:hover { background: rgba(255,255,255,0.3); }
    #toolbar button:disabled { opacity: 0.4; cursor: default; }
    #zoom-label { min-width: 44px; text-align: center; user-select: none; }
  </style>
</head>
<body>
  <div id="toolbar">
    <button id="zoom-out" type="button" title="Zoom out" aria-label="Zoom out">−</button>
    <span id="zoom-label" aria-live="polite">100%</span>
    <button id="zoom-in" type="button" title="Zoom in" aria-label="Zoom in">+</button>
  </div>
  <div id="container">
    <div id="page-wrap"></div>
  </div>
  <!-- ``v`` busts the browser cache; keep it in step with ``_viewer_src``. -->
  <script type="module" src="/static/pdfjs/review_viewer.mjs?v=2"></script>
</body>
</html>
