[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "uwazi-API"
dynamic = ["version"]
description = "A Python module for Uwazi"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Ali Altıparmak", email = "ali6parmakk@gmail.com" },
    { name = "Gabriel Piles" }
]
requires-python = ">=3.12"
dependencies = [
    "requests==2.33.1",
    "urllib3==2.6.3",
    "pandas==3.0.3",
    "pydantic==2.13.3",
    "load-dotenv==0.1.0",
    "loguru==0.7.3",
    "fastapi==0.136.3",
    "pydantic-ai==1.106.0",
    "uvicorn==0.49.0",
    "jinja2==3.1.6",
    "pyyaml==6.0.3",
]

[project.urls]
Homepage = "https://github.com/huridocs/python_uwazi_API"
Documentation = "https://github.com/huridocs/python_uwazi_API"
Repository = "https://github.com/huridocs/python_uwazi_API"

[project.scripts]
uwazi-admin-agent = "uwazi_admin_agent.drivers.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-cov>=4.0",
    "ruff>=0.12.5",
    "mypy>=1.0",
    "pandas-stubs>=2.3",
]

[tool.hatch.version]
source = "vcs"
raw-options = { version_scheme = "post-release", local_scheme = "no-local-version" }

[tool.hatch.build.targets.wheel]
packages = ["src/uwazi_api", "src/uwazi_agent", "src/uwazi_admin_agent"]

[tool.ruff]
line-length = 125
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["lxml.*"]
ignore_missing_imports = true
